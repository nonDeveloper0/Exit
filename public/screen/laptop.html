<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나팀장 노트북</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    background: #111827;
    color: #111827;
    overflow: hidden;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
  }
  .screen.active { display: block; }

  #lockScreen {
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.18), transparent 24%),
      radial-gradient(circle at 85% 15%, rgba(54,148,255,.46), transparent 30%),
      linear-gradient(135deg, #0e4674 0%, #0b6cae 45%, #0d5a7b 72%, #1e4d66 100%);
  }
  .lock-shade {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 24px 56px;
    background: linear-gradient(to bottom, rgba(0,0,0,.1), rgba(0,0,0,.45));
  }
  .lock-time {
    position: absolute;
    top: clamp(28px, 7vh, 62px);
    left: clamp(24px, 5vw, 44px);
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,.32);
  }
  .clock { font-size: clamp(48px, 10vw, 82px); line-height: .95; font-weight: 300; letter-spacing: 0; }
  .date { margin-top: 12px; font-size: 18px; font-weight: 400; }
  .login-panel {
    width: min(420px, calc(100% - 32px));
    margin: 0 auto;
    color: #fff;
    text-align: center;
  }
  .avatar {
    width: 84px;
    height: 84px;
    margin: 0 auto 14px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.22);
    border: 1px solid rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 50px rgba(0,0,0,.25);
    font-size: 40px;
  }
  .lock-name { font-size: 22px; font-weight: 600; }
  .lock-sub { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.82); }
  .quiz-box {
    margin-top: 18px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.32);
    border-radius: 6px;
    background: rgba(0,0,0,.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }
  .quiz-label {
    font-size: 12px;
    color: rgba(255,255,255,.72);
  }
  .quiz-question {
    margin-top: 6px;
    color: #fff;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 600;
    word-break: keep-all;
  }
  .team-select {
    margin-top: 18px;
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid rgba(255,255,255,.32);
    border-radius: 4px;
    background: rgba(255,255,255,.92);
    color: #111827;
    font-size: 15px;
  }
  .pw-row {
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1fr 44px 44px;
    gap: 4px;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,.23);
  }
  .pw-input {
    min-width: 0;
    height: 42px;
    padding: 0 12px;
    border: 0;
    outline: 0;
    background: rgba(255,255,255,.92);
    color: #111827;
    font-size: 15px;
  }
  .pw-btn {
    border: 0;
    background: #0078d4;
    color: #fff;
    font-size: 21px;
  }
  .pw-btn:active { background: #005a9e; }
  .pw-eye {
    border: 0;
    background: rgba(255,255,255,.92);
    color: #4b5563;
    display: grid;
    place-items: center;
  }
  .pw-eye:active { background: rgba(230,235,240,.95); }
  .pw-eye svg { width: 18px; height: 18px; display: block; }
  .pw-eye .icon-slash { display: none; }
  .pw-eye.on .icon-open { display: none; }
  .pw-eye.on .icon-slash { display: block; }
  .pw-error { height: 18px; margin-top: 8px; color: #ffd6d6; font-size: 12px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-4px)} }

  #desktop {
    background:
      radial-gradient(circle at 16% 18%, rgba(255,255,255,.18), transparent 22%),
      linear-gradient(135deg, #186a9d 0%, #0d5d86 42%, #174761 72%, #253045 100%);
  }
  .desktop-area {
    position: absolute;
    inset: 0 0 46px;
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fill, 86px);
    grid-auto-rows: 92px;
    align-content: start;
    gap: 8px 10px;
  }
  .file-icon {
    width: 86px;
    height: 92px;
    padding: 7px 5px;
    border: 1px solid transparent;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    gap: 6px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.75);
    background: transparent;
    position: relative;
  }
  .file-icon:hover, .file-icon:focus-visible, .file-icon.selected {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.34);
    outline: 0;
  }
  .file-icon.done::after {
    content: "✓";
    position: absolute;
    top: 4px;
    right: 9px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #107c10;
    color: #fff;
    font-size: 12px;
    text-shadow: none;
    border: 1px solid rgba(255,255,255,.7);
  }
  .icon-art {
    width: 46px;
    height: 52px;
    border-radius: 3px;
    display: grid;
    place-items: center;
    position: relative;
    box-shadow: 0 8px 16px rgba(0,0,0,.22);
    text-shadow: none;
  }
  .icon-art.pdf { background: linear-gradient(135deg, #f87171, #dc2626); }
  .icon-art::before { color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .5px; }
  .icon-art.pdf::before { content: "PDF"; }
  .label {
    max-width: 78px;
    font-size: 12px;
    line-height: 1.25;
    text-align: center;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .taskbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 46px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: rgba(243,246,250,.86);
    border-top: 1px solid rgba(255,255,255,.6);
    backdrop-filter: blur(24px);
    color: #1f2937;
    box-shadow: 0 -1px 0 rgba(0,0,0,.08);
  }
  .task-center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .task-app, .start-btn {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #1f2937;
  }
  .task-app:hover, .start-btn:hover { background: rgba(0,0,0,.06); }
  .start-logo {
    width: 18px;
    height: 18px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
  }
  .start-logo span { background: #0078d4; }
  .task-search {
    width: min(220px, 30vw);
    height: 32px;
    border: 1px solid #d1d5db;
    border-radius: 16px;
    background: #fff;
    color: #6b7280;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 12px;
  }
  .tray {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-right: 12px;
    font-size: 12px;
  }
  .session-pill {
    justify-self: start;
    margin-left: 12px;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border-radius: 14px;
    background: rgba(255,255,255,.72);
    border: 1px solid rgba(0,0,0,.08);
    font-size: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #107c10; }
  .logout-btn {
    border: 0;
    background: transparent;
    color: #005a9e;
    font-size: 12px;
  }

  .window-overlay {
    position: fixed;
    inset: 28px 0 46px;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    pointer-events: none;
  }
  .window-overlay.open { display: flex; }
  .window {
    width: min(1120px, 100%);
    height: min(720px, 100%);
    min-height: 420px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
    border: 1px solid rgba(0,0,0,.26);
    border-radius: 7px;
    box-shadow: 0 22px 70px rgba(0,0,0,.42);
    pointer-events: auto;
  }
  .win-titlebar {
    height: 34px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    background: #f7f7f7;
    border-bottom: 1px solid #dadada;
    color: #202020;
    font-size: 12px;
  }
  .win-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 10px;
  }
  .tiny-pdf {
    width: 24px;
    height: 18px;
    display: grid;
    place-items: center;
    border-radius: 2px;
    background: #dc2626;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
  }
  .title-text { justify-self: center; color: #2b2b2b; }
  .win-controls { display: flex; height: 34px; }
  .win-control {
    width: 46px;
    height: 34px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: #202020;
    font-size: 14px;
  }
  .win-control:hover { background: #e5e5e5; }
  .win-control.close:hover { background: #c42b1c; color: #fff; }
  .pdf-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: #525659;
    padding: 22px 16px;
    display: flex;
    justify-content: center;
  }
  .pdf-page {
    width: min(720px, 100%);
    align-self: flex-start;
    background: #fff;
    color: #1a1a1a;
    padding: 40px 44px 48px;
    box-shadow: 0 6px 22px rgba(0,0,0,.45);
    font-size: 13px;
    line-height: 1.6;
  }
  .pdf-doc-head {
    display: flex;
    justify-content: space-between;
    align-items: start;
    padding-bottom: 12px;
    border-bottom: 2px solid #111827;
  }
  .pdf-org { font-size: 12px; color: #4b5563; line-height: 1.4; }
  .pdf-badge { font-size: 11px; color: #b00000; border: 1px solid #b00000; border-radius: 3px; padding: 2px 6px; white-space: nowrap; }
  .pdf-title { margin: 22px 0 6px; font-size: 22px; font-weight: 800; text-align: center; letter-spacing: 2px; }
  .pdf-sub { margin-bottom: 20px; font-size: 12px; color: #6b7280; text-align: center; }
  .pdf-meta { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 12px; }
  .pdf-meta th, .pdf-meta td { border: 1px solid #cbd5e1; padding: 6px 9px; text-align: left; }
  .pdf-meta th { background: #f1f5f9; width: 84px; color: #334155; font-weight: 600; white-space: nowrap; }
  .pdf-section { margin: 20px 0 8px; font-size: 13px; font-weight: 700; color: #111827; border-left: 3px solid #b00000; padding-left: 8px; }
  .pdf-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .pdf-table th, .pdf-table td { border: 1px solid #cbd5e1; padding: 6px 9px; text-align: left; vertical-align: top; }
  .pdf-table th { background: #f1f5f9; color: #334155; font-weight: 600; }
  .pdf-table .hit { color: #b00000; font-weight: 700; }
  .pdf-opinion { margin-top: 10px; padding: 12px 14px; background: #fff7f7; border: 1px solid #f0c9c9; border-radius: 4px; font-size: 12px; color: #7f1d1d; }
  .pdf-sign { margin-top: 26px; text-align: right; font-size: 12px; color: #374151; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 60px;
    z-index: 700;
    transform: translateX(-50%) translateY(16px);
    opacity: 0;
    pointer-events: none;
    min-width: min(360px, calc(100% - 32px));
    padding: 12px 16px;
    border-radius: 6px;
    background: #202020;
    color: #fff;
    box-shadow: 0 12px 36px rgba(0,0,0,.32);
    font-size: 13px;
    transition: .2s ease;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast small { display: block; margin-top: 3px; color: #c7e0f4; font-size: 11px; }

  @media (max-width: 720px) {
    .task-search { display: none; }
    .window-overlay { padding: 8px; }
    .window { height: 100%; min-height: 0; border-radius: 4px; }
    .title-text { justify-self: start; }
    .tray { gap: 7px; padding-right: 8px; }
    .session-pill { margin-left: 8px; padding: 0 8px; }
    .lock-shade { padding: 88px 16px 40px; }
    .lock-time { top: 24px; left: 24px; }
    .date { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="screen active" id="lockScreen">
  <div class="lock-shade">
    <div class="lock-time">
      <div class="clock" id="lockClock">22:47</div>
    </div>
    <div class="login-panel">
      <div class="avatar">👤</div>
      <div class="lock-name">나팀장</div>
      <!-- 잠금 해제 퀴즈 (사용 안 함 — 조번호 선택 + 공통 암호 방식으로 대체)
      <div class="quiz-box">
        <div class="quiz-label">잠금 해제 퀴즈</div>
        <div class="quiz-question">문제 미확정: 현장 단서와 연결되는 퀴즈가 이 영역에 들어갑니다.</div>
      </div>
      -->
      <select class="team-select" id="teamSelect" aria-label="조 번호 선택">
        <option value="" disabled selected>조 번호 선택</option>
        <option value="1">1조</option>
        <option value="2">2조</option>
        <option value="3">3조</option>
        <option value="4">4조</option>
        <option value="5">5조</option>
        <option value="6">6조</option>
      </select>
      <div class="pw-row">
        <input class="pw-input" id="pwInput" type="password" inputmode="numeric" placeholder="암호" maxlength="6" />
        <button class="pw-eye" id="pwEye" type="button" onclick="togglePw()" aria-label="암호 표시" aria-pressed="false">
          <svg class="icon-open" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" /></svg>
          <svg class="icon-slash" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" /><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" /></svg>
        </button>
        <button class="pw-btn" type="button" onclick="tryUnlock()" aria-label="로그인">›</button>
      </div>
      <div class="pw-error" id="pwError"></div>
    </div>
  </div>
</div>

<div class="screen" id="desktop">
  <main class="desktop-area" aria-label="Windows 바탕 화면">
    <button class="file-icon" id="filePdf" type="button" onclick="selectFile('filePdf')" ondblclick="openPdf()">
      <span class="icon-art pdf"></span>
      <span class="label">지문감식 결과보고서.pdf</span>
    </button>
  </main>

  <footer class="taskbar">
    <div class="session-pill"><span class="dot"></span><span id="sessionLabel">세션 없음</span><button class="logout-btn" type="button" onclick="logout()">잠금</button></div>
    <div class="task-center">
      <button class="start-btn" type="button" aria-label="시작"><span class="start-logo"><span></span><span></span><span></span><span></span></span></button>
      <div class="task-search">검색</div>
      <button class="task-app" type="button" ondblclick="openPdf()" title="지문감식 결과보고서">PDF</button>
    </div>
    <div class="tray"><span>Wi-Fi</span><span>🔊</span><span id="taskClock">22:47</span></div>
  </footer>
</div>

<div class="window-overlay" id="winPdf">
  <section class="window" aria-label="PDF 뷰어">
    <div class="win-titlebar">
      <div class="win-title-left"><span class="tiny-pdf">PDF</span><span>지문감식 결과보고서.pdf</span></div>
      <div class="title-text">지문감식 결과보고서.pdf</div>
      <div class="win-controls">
        <button class="win-control" type="button" aria-label="최소화">−</button>
        <button class="win-control" type="button" aria-label="최대화">□</button>
        <button class="win-control close" type="button" onclick="closeWindow('winPdf')" aria-label="닫기">×</button>
      </div>
    </div>
    <div class="pdf-body">
      <!-- 지문감식 결과보고서 본문: 내용 비워둠. 단서팀 확정본으로 채우세요.
           .pdf-doc-head / .pdf-meta / .pdf-section / .pdf-table / .pdf-opinion / .pdf-sign 스타일 준비돼 있음.
           작성 안내: docs/01_md/EDIT_GUIDE.md 12장, progress.md 참고. -->
      <article class="pdf-page">
        <h1 class="pdf-title">지문감식 결과보고서</h1>
        <div class="pdf-sub">내용 준비 중</div>
      </article>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const UNLOCK_PASSWORD = "980721";
  // 지문감식 결과보고서 열람 시 선택한 조 보관함에 저장될 증거 ID (앱 data.ts의 E16)
  const PDF_EVIDENCE_ID = "E16";
  // Supabase 연결 (anon 공개키 — 앱과 동일 값)
  const SUPABASE_URL = "https://egnkhewpeyzcwdtstdxa.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_l7fmKV4M3gSPA0iPEgzghw_THQWVXAH";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let teamNo = null;
  let idleTimer = null;

  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
    document.getElementById("lockClock").textContent = time;
    document.getElementById("taskClock").textContent = time;
  }
  updateClock();
  setInterval(updateClock, 15000);

  function tryUnlock() {
    const select = document.getElementById("teamSelect");
    const input = document.getElementById("pwInput");
    const error = document.getElementById("pwError");
    if (!select.value) {
      error.textContent = "조 번호를 선택하세요.";
      shake(select);
      return;
    }
    if (input.value.trim() !== UNLOCK_PASSWORD) {
      error.textContent = "비밀번호가 올바르지 않습니다.";
      input.value = "";
      shake(input.closest(".pw-row"));
      return;
    }
    teamNo = parseInt(select.value, 10);
    document.getElementById("sessionLabel").textContent = teamNo + "조 세션";
    document.getElementById("lockScreen").classList.remove("active");
    document.getElementById("desktop").classList.add("active");
    error.textContent = "";
    resetIdle();
  }
  document.getElementById("pwInput").addEventListener("keydown", event => {
    if (event.key === "Enter") tryUnlock();
  });

  function togglePw() {
    const input = document.getElementById("pwInput");
    const btn = document.getElementById("pwEye");
    const reveal = input.type === "password";
    input.type = reveal ? "text" : "password";
    btn.classList.toggle("on", reveal);
    btn.setAttribute("aria-pressed", reveal ? "true" : "false");
    btn.setAttribute("aria-label", reveal ? "암호 숨기기" : "암호 표시");
    input.focus();
  }

  function selectFile(iconId) {
    resetIdle();
    document.querySelectorAll(".file-icon.selected").forEach(el => el.classList.remove("selected"));
    document.getElementById(iconId).classList.add("selected");
  }

  function openPdf() {
    resetIdle();
    if (!teamNo) return;
    document.getElementById("winPdf").classList.add("open");
    collect("지문감식 결과보고서", "filePdf", PDF_EVIDENCE_ID);
  }

  function closeWindow(id) {
    resetIdle();
    document.getElementById(id).classList.remove("open");
  }

  function collect(name, iconId, evidenceId) {
    const icon = document.getElementById(iconId);
    if (icon.classList.contains("done")) return;
    icon.classList.add("done");
    saveToTeam(evidenceId);
    const toast = document.getElementById("toast");
    toast.innerHTML = name + " 수집 완료<small>" + teamNo + "조 수집함으로 전송됨</small>";
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2400);
  }

  async function saveToTeam(evidenceId) {
    if (!teamNo || !evidenceId) return;
    try {
      const { error } = await sb
        .from("team_evidence_items")
        .upsert(
          { pair_id: String(teamNo), evidence_id: evidenceId, type: "collected" },
          { onConflict: "pair_id,evidence_id,type", ignoreDuplicates: true }
        );
      if (error) console.error("수집 저장 실패:", error.message);
    } catch (e) {
      console.error("수집 저장 오류:", e);
    }
  }

  function logout() {
    document.getElementById("winPdf").classList.remove("open");
    document.getElementById("desktop").classList.remove("active");
    document.querySelectorAll(".file-icon.done").forEach(el => el.classList.remove("done"));
    document.getElementById("lockScreen").classList.add("active");
    document.getElementById("teamSelect").value = "";
    document.getElementById("pwInput").value = "";
    document.getElementById("pwInput").type = "password";
    document.getElementById("pwEye").classList.remove("on");
    document.getElementById("pwEye").setAttribute("aria-pressed", "false");
    document.getElementById("pwError").textContent = "";
    teamNo = null;
    clearTimeout(idleTimer);
  }

  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(logout, 90000);
  }

  function shake(el) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
  }
</script>
</body>
</html>
