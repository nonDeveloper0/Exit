<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<!-- PWA: 홈화면 설치 → 전체화면 실행 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="전화">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/screen/icons/phone3-180.png">
<link rel="manifest" href="/screen/phone3.webmanifest">
<title>휴대폰</title>
<style>
  :root{
    --danger:#ff3b30;
    --text-dim:#8e8e93;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  #frame{
    position:relative;
    width:390px;
    height:844px;
    margin:20px auto;
    background:#000;
    border-radius:44px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    overflow:hidden;
    border:8px solid #1c1c1e;
  }
  @media (max-width:430px){
    #frame{ width:100vw; height:100vh; margin:0; border-radius:0; border:none; }
  }
  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    background:#000;
    color:#fff;
    animation: fadeIn .25s ease;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{ from{opacity:0; transform:scale(.98);} to{opacity:1; transform:scale(1);} }

  .statusbar{
    height:47px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; font-size:15px; font-weight:600; flex-shrink:0;
    z-index:20;
  }
  .statusbar .time{ font-variant-numeric: tabular-nums; }
  .statusbar .right{display:flex; align-items:center; gap:5px;}
  .notch{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#000; border-radius:16px; z-index:30;
  }

  /* HOME SCREEN */
  #home{
    background-size:cover; background-position:center;
    justify-content:flex-start;
  }
  #home .statusbar{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4);}
  .app-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:20px 0;
    padding:16px 18px 0;
  }
  .app-icon.static{ cursor:default; }
  .icon-sq{
    width:60px; height:60px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .icon-label{font-size:11px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5); font-weight:500;}
  .icon-white{background:#fff; color:#111;}
  .icon-black{background:linear-gradient(135deg,#3a3a3c,#1c1c1e);}
  .icon-gray{background:linear-gradient(135deg,#8e8e93,#636366);}
  .icon-blue{background:linear-gradient(135deg,#36a9ff,#1d7ee0);}
  .icon-orange{background:linear-gradient(135deg,#ffb75e,#ed8f03);}
  .icon-teal{background:linear-gradient(135deg,#43e9d0,#0fb5a6);}
  .icon-yellow2{background:linear-gradient(135deg,#ffe27a,#ffb800);}
  .icon-navy{background:linear-gradient(135deg,#4b6cb7,#182848);}
  .icon-green2{background:linear-gradient(135deg,#7fdc7f,#2fa84f);}
  .icon-red{background:linear-gradient(135deg,#ff5f6d,#ee2b3d);}
  .icon-purple{background:linear-gradient(135deg,#c471ed,#8a3ef0);}
  .icon-forest{background:linear-gradient(135deg,#4b7f52,#2d5233);}
  .icon-kakao{background:#fee500;}
  .icon-phone{background:linear-gradient(#65d072,#3ac352);}
  .app-icon{
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; border:none; background:none;
  }
  .icon-wrap{position:relative;}
  .badge{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
    font-size:11px; font-weight:700; min-width:19px; height:19px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  .dock{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    display:flex; gap:18px; background:rgba(255,255,255,.18);
    backdrop-filter:blur(20px); padding:14px 18px; border-radius:32px;
  }
  .home-indicator{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:134px; height:5px; background:#fff; border-radius:3px; opacity:.9;
  }

  /* APP HEADER */
  .app-header{
    display:flex; align-items:center; padding:8px 12px; flex-shrink:0; position:relative;
  }
  .back-btn{
    background:none; border:none; color:inherit; font-size:17px; display:flex; align-items:center; gap:2px; cursor:pointer; padding:6px 4px;
  }
  .app-title{
    position:absolute; left:50%; transform:translateX(-50%); font-size:17px; font-weight:600;
  }

  /* PHONE APP */
  #phoneapp{ background:#000; color:#fff; }
  .tab-strip{
    display:flex; padding:6px 16px 14px; gap:24px; font-size:15px; color:var(--text-dim); flex-shrink:0;
  }
  .tab-strip .tab.active{ color:#fff; font-weight:600; border-bottom:2px solid #fff; padding-bottom:6px;}
  .call-list{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:20px; }
  .call-row{
    display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid #1c1c1e;
  }
  .call-avatar{
    width:40px; height:40px; border-radius:50%; background:#3a3a3c; display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0; color:#aaa;
  }
  .call-info{flex:1; min-width:0;}
  .call-name{font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .call-name.missed{color:var(--danger);}
  .call-sub{font-size:13px; color:var(--text-dim); margin-top:2px;}
  .call-sub.missed{color:var(--danger);}
  .call-time{font-size:13px; color:var(--text-dim); flex-shrink:0;}
  .call-info-icon{color:#0a84ff; font-size:20px; padding:0 4px;}

  ::-webkit-scrollbar{ display:none; }
</style>
</head>

        <div class="icon-wrap"><div class="icon-sq icon-green2">💬</div></div>

      </button>
      <button class="app-icon static">

  <!-- PHONE APP: CALL LIST -->
  <div class="screen" id="phoneapp">

    <div class="app-header">

      <div class="app-title">최근 통화</div>

    <div class="tab-strip"><div class="tab active">전체</div><div class="tab">부재중</div></div>
    <div class="call-list" id="callList"></div>

  </div>

</div>

<script>
// 뒤로가기(모바일 브라우저 스와이프/버튼)로 화면을 벗어나지 못하게 막음 — 히스토리를 계속 되채워서 popstate를 무력화
// ⚠️ 안드로이드 크롬의 "제스처 뒤로가기(예측형 뒤로가기)"는 이 트릭을 우회하는 경우가 있음(크롬/안드로이드 자체 한계).
//    2차 안전장치로 beforeunload를 걸어 실제로 페이지를 벗어나려 하면 브라우저 기본 확인창이라도 뜨게 함.
// 갤럭시 One UI '예측형 뒤로가기'는 히스토리가 얕으면 첫 화면에서 그대로 앱을 나가버림.
// → 더미 히스토리를 여러 겹 쌓아 항상 여유분을 유지하고, 뒤로가기로 소모되면 즉시 다시 채움.
for (let i = 0; i < 5; i++) history.pushState(null, "", location.href);
window.addEventListener("popstate", () => {
  history.pushState(null, "", location.href);
  history.pushState(null, "", location.href);
});
window.addEventListener("beforeunload", (e) => { e.preventDefault(); e.returnValue = ""; });

function pad(n){return n.toString().padStart(2,'0');}
function updateClock(){
  const now = new Date();
  const str24 = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.querySelectorAll('#clockTime1,#clockTime2').forEach(el=>{ el.textContent = str24; });
}
updateClock(); setInterval(updateClock, 10000);

function openScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

const callData = [
  {name:'나팀장', sub:'통화 7분 31초', time:'19:40'},
  {name:'김전무', sub:'통화 9분 18초', time:'18:36'},
  {name:'채소장', sub:'통화 3분 12초', time:'18:32'},
  {name:'재무팀장', sub:'통화 11분 46초', time:'17:20'},
  {name:'이대리', sub:'통화 6분 22초', time:'16:05'},
  {name:'박실장', sub:'통화 12분 07초', time:'14:50'},
  {name:'법무법인 서앤파트너스 (02-987-6543)', sub:'통화 8분 15초', time:'13:30'},
  {name:'(주)동아건설자재 (02-123-4567)', sub:'통화 5분 33초', time:'11:25'},
  {name:'임원회의(4명)', sub:'통화 1시간 12분', time:'09:45'},
  {name:'김사원', sub:'통화 3분 42초', time:'09:05'},
  {name:'이사님', sub:'통화 15분 20초', time:'어제'},
  {name:'(주)한빛전자 (02-555-3210)', sub:'통화 4분 08초', time:'어제'},
  {name:'최부장', sub:'통화 7분 45초', time:'어제'},
  {name:'정과장', sub:'통화 2분 58초', time:'어제'},
  {name:'스팸전화', missed:true, time:'어제'},
];

function renderCallList(){
  const list = document.getElementById('callList');
  list.innerHTML = '';
  callData.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'call-row';
    row.innerHTML = `
      <div class="call-avatar">${c.name.includes('스팸') ? '⚠️' : '👤'}</div>
      <div class="call-info">
        <div class="call-name ${c.missed?'missed':''}">${c.name}</div>
        <div class="call-sub ${c.missed?'missed':''}">${c.missed ? '부재중 전화' : c.sub}</div>
      </div>
      <div class="call-time">${c.time}</div>
      <div class="call-info-icon">ⓘ</div>
    `;
    list.appendChild(row);
  });
}

renderCallList();
</script>
</body>
</html>
