<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동그리의 휴대폰</title>
<style>
  :root{
    --ios-bg:#000;
    --status-h: 47px;
    --kakao-yellow:#fee500;
    --kakao-bg:#b2c7d9;
    --kakao-bubble-me:#fee500;
    --kakao-bubble-you:#ffffff;
    --danger:#ff3b30;
    --text-dim:#8e8e93;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  #frame{
    position:relative;
    width:390px;
    height:844px;
    margin:20px auto;
    background:#000;
    border-radius:44px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    overflow:hidden;
    border:8px solid #1c1c1e;
  }
  @media (max-width:430px){
    #frame{ width:100vw; height:100vh; margin:0; border-radius:0; border:none; }
  }
  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    background:#000;
    color:#fff;
    animation: fadeIn .25s ease;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{ from{opacity:0; transform:scale(.98);} to{opacity:1; transform:scale(1);} }

  .statusbar{
    height:var(--status-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; font-size:15px; font-weight:600; flex-shrink:0;
    z-index:20;
  }
  .statusbar .time{ font-variant-numeric: tabular-nums; }
  .statusbar .right{display:flex; align-items:center; gap:5px;}
  .notch{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#000; border-radius:16px; z-index:30;
  }

  /* HOME SCREEN */
  #home{
    background-size:cover; background-position:center;
    justify-content:flex-start;
  }
  #home .statusbar{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4);}
  .home-datebar{
    text-align:center; margin-top:2px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.4);
    font-size:13px; font-weight:500; letter-spacing:.2px;
  }
  .app-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:20px 0;
    padding:0 18px; flex-shrink:0;
  }
  .app-grid-top{ padding-top:12px; }
  .face-clear-gap{ flex-shrink:0; height:310px; }
  .app-icon.static{ cursor:default; }
  .icon-pink{background:linear-gradient(135deg,#ff9a9e,#fecfef);}
  .icon-blue{background:linear-gradient(135deg,#36a9ff,#1d7ee0);}
  .icon-gray{background:linear-gradient(135deg,#8e8e93,#636366);}
  .icon-orange{background:linear-gradient(135deg,#ffb75e,#ed8f03);}
  .icon-purple{background:linear-gradient(135deg,#c471ed,#8a3ef0);}
  .icon-red{background:linear-gradient(135deg,#ff5f6d,#ee2b3d);}
  .icon-teal{background:linear-gradient(135deg,#43e9d0,#0fb5a6);}
  .icon-black{background:linear-gradient(135deg,#3a3a3c,#1c1c1e);}
  .icon-yellow2{background:linear-gradient(135deg,#ffe27a,#ffb800);}
  .icon-navy{background:linear-gradient(135deg,#4b6cb7,#182848);}
  .icon-white{background:#fff; color:#111;}
  .icon-green2{background:linear-gradient(135deg,#7fdc7f,#2fa84f);}
  .dock{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    display:flex; gap:18px; background:rgba(255,255,255,.18);
    backdrop-filter:blur(20px); padding:14px 18px; border-radius:32px;
  }
  .app-icon{
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; border:none; background:none;
  }
  .icon-sq{
    width:60px; height:60px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .icon-label{font-size:11px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5); font-weight:500;}
  .icon-phone{background:linear-gradient(#65d072,#3ac352);}
  .icon-kakao{background:#fee500;}
  .badge{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
    font-size:11px; font-weight:700; min-width:19px; height:19px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; padding:0 4px; border:2px solid rgba(0,0,0,0);
  }
  .icon-wrap{position:relative;}
  .home-indicator{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:134px; height:5px; background:#fff; border-radius:3px; opacity:.9;
  }
  #home .home-indicator{background:#fff;}

  /* APP HEADER (shared) */
  .app-header{
    display:flex; align-items:center; padding:8px 12px; flex-shrink:0; position:relative;
  }
  .back-btn{
    background:none; border:none; color:inherit; font-size:17px; display:flex; align-items:center; gap:2px; cursor:pointer; padding:6px 4px;
  }
  .app-title{
    position:absolute; left:50%; transform:translateX(-50%); font-size:17px; font-weight:600;
  }

  /* PHONE APP */
  #phoneapp{ background:#000; color:#fff; }
  #phoneapp .app-header{ color:#fff; }
  .tab-strip{
    display:flex; padding:6px 16px 14px; gap:24px; font-size:15px; color:var(--text-dim); flex-shrink:0;
  }
  .tab-strip .tab.active{ color:#fff; font-weight:600; border-bottom:2px solid #fff; padding-bottom:6px;}
  .call-list{ flex:1; overflow-y:auto; padding-bottom:20px; }
  .call-row{
    display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid #1c1c1e; cursor:pointer;
  }
  .call-avatar{
    width:40px; height:40px; border-radius:50%; background:#3a3a3c; display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0; color:#aaa;
  }
  .call-info{flex:1; min-width:0;}
  .call-name{font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .call-name.missed{color:var(--danger);}
  .call-sub{font-size:13px; color:var(--text-dim); margin-top:2px;}
  .call-sub.missed{color:var(--danger);}
  .call-time{font-size:13px; color:var(--text-dim); flex-shrink:0;}
  .call-info-icon{color:#0a84ff; font-size:20px; padding:0 4px;}

  /* MISSED CALL DETAIL */
  #missedDetail{ background:#000; color:#fff; }
  .detail-profile{ text-align:center; padding:20px 0 10px; }
  .detail-avatar{
    width:88px; height:88px; border-radius:50%; margin:0 auto 12px; background:#3a3a3c;
    display:flex; align-items:center; justify-content:center; font-size:34px;
  }
  .detail-name{font-size:22px; font-weight:600;}
  .detail-sub{font-size:14px; color:var(--text-dim); margin-top:4px;}
  .detail-actions{ display:flex; justify-content:center; gap:50px; padding:20px 0; }
  .detail-action{ display:flex; flex-direction:column; align-items:center; gap:6px; color:#0a84ff; font-size:12px;}
  .detail-action .circle{ width:56px; height:56px; border-radius:50%; background:#1c1c1e; display:flex; align-items:center; justify-content:center; font-size:22px;}
  .missed-log-title{ padding:14px 18px 4px; font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px;}
  .missed-log-item{
    display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid #1c1c1e; font-size:15px;
  }
  .missed-log-item .l{ color:#fff; display:flex; align-items:center; gap:8px;}
  .missed-log-item .r{ color:var(--text-dim); font-size:14px;}

  /* KAKAO APP */
  #kakaoapp{ background:var(--kakao-bg); color:#000; }
  #kakaoapp .app-header{ background:var(--kakao-bg); color:#000; }
  #kakaoapp .app-title{color:#000;}
  .kakao-search{
    margin:6px 14px 10px; background:rgba(255,255,255,.6); border-radius:10px; padding:8px 12px; font-size:14px; color:#5a6a75; flex-shrink:0;
  }
  .chat-list{ flex:1; overflow-y:auto; background:#fff; border-top-left-radius:16px; border-top-right-radius:16px; }
  .chat-row{
    display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #f1f1f1; cursor:pointer;
  }
  .chat-avatar{
    width:48px; height:48px; border-radius:14px; background:#ffe08a; display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0; color:#8a6d00; font-weight:700; position:relative;
  }
  .chat-avatar.group{background:#c9e3ff; color:#1560b8;}
  .chat-avatar.default-profile{ background:#c7c9cc; color:#f5f5f5; font-size:24px; }
  .chat-avatar.photo-avatar{ background-size:cover; background-position:center; background-color:#333; }
  .chat-mid{ flex:1; min-width:0; }
  .chat-name{ font-size:15.5px; font-weight:600; color:#111; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chat-preview{ font-size:13.5px; color:#8a8a8e; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chat-right{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  .chat-time{ font-size:12px; color:#a0a0a5;}
  .chat-unread{
    background:var(--kakao-yellow); color:#3b2f00; font-size:11px; font-weight:700; min-width:18px; height:18px;
    border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px;
  }

  /* CHAT ROOM */
  #chatroom{ background:var(--kakao-bg); color:#000; }
  #chatroom .app-header{ background:var(--kakao-bg); color:#000; }
  #chatroom .app-title{color:#000;}
  .chat-scroll{ flex:1; overflow-y:auto; padding:14px 10px 20px; display:flex; flex-direction:column; gap:3px;}
  .date-chip{
    align-self:center; background:rgba(255,255,255,.7); color:#5a5a5a; font-size:12px; padding:4px 12px; border-radius:12px; margin:10px 0;
  }
  .bubble-row{ display:flex; align-items:flex-end; gap:6px; max-width:100%; }
  .bubble-row.me{ align-self:flex-end; flex-direction:row-reverse; }
  .bubble-row.you{ align-self:flex-start; }
  .bubble-meta{ display:flex; flex-direction:column; align-items:flex-end; font-size:10.5px; color:#5a5a5a; white-space:nowrap; margin-bottom:2px;}
  .bubble-row.you .bubble-meta{align-items:flex-start;}
  .bubble-unread{ color:var(--kakao-yellow-dark,#c9a500); font-weight:700; }
  .bubble{
    max-width:220px; padding:9px 13px; font-size:14.5px; line-height:1.4; border-radius:14px; word-break:break-word;
  }
  .bubble-row.me .bubble{ background:var(--kakao-bubble-me); border-top-right-radius:4px; }
  .bubble-row.you .bubble{ background:#fff; border-top-left-radius:4px; }
  .you-avatar{
    width:36px; height:36px; border-radius:12px; background:#ffe08a; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:#8a6d00; font-weight:700;
  }
  .you-avatar.photo-avatar{ background-size:cover; background-position:center; background-color:#333; }
  .you-name-tag{ font-size:12px; color:#5a5a5a; margin:6px 0 2px 42px; }
  .chat-inputbar{
    flex-shrink:0; background:#fff; display:flex; align-items:center; gap:10px; padding:8px 12px calc(8px + 10px);
    border-top:1px solid #eee;
  }
  .chat-inputbar .plus{ width:28px; height:28px; border-radius:50%; background:#e2e2e2; display:flex; align-items:center; justify-content:center; color:#888; font-size:16px; flex-shrink:0;}
  .chat-inputbar .field{ flex:1; background:#f2f2f2; border-radius:16px; padding:9px 14px; font-size:14px; color:#aaa;}

  ::-webkit-scrollbar{ display:none; }
</style>
</head>

/* ---------- live clock ---------- */
function pad(n){return n.toString().padStart(2,'0');}
function updateClock(){
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const h12 = ((h % 12) || 12);
  const str24 = `${pad(h)}:${pad(m)}`;
  document.querySelectorAll('#clockTime1,#clockTime2,#clockTime3,#clockTime4,#clockTime5,#clockTime6,#clockTime7')
    .forEach(el=>{ el.textContent = el.id==='clockTime2' ? str24 : str24; });
}
updateClock(); setInterval(updateClock, 10000);

/* ---------- navigation ---------- */
function openScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='chatroom') renderChatRoom();
  if(id==='chatroomLee') renderChatLee();
  if(id==='kakaoapp') renderChatList();
}

  if(c.avatarType==='photo') return '';
  if(c.avatarType==='group') return c.avatar;
  return '👤';
}
function renderChatList(){
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chatListData.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'chat-row';
    row.innerHTML = `
      <div class="chat-avatar ${c.group?'group':''} ${c.avatarType==='default'?'default-profile':''} ${c.avatarType==='photo'?'photo-avatar':''}">${avatarInnerHTML(c)}</div>

        <div class="chat-time">${c.time}</div>
        ${c.unread ? `<div class="chat-unread">${c.unread}</div>` : ''}
      </div>
    `;
    if(c.avatarType==='photo'){
      row.querySelector('.chat-avatar').style.backgroundImage = `url('${wallpaperDataUrl}')`;
    }
    if(c.target){
      row.addEventListener('click', ()=>openScreen(c.target));
    } else {
      row.style.cursor = 'default';
    }
    list.appendChild(row);
  });
}

function bubbleHTML(m){
  const metaTop = m.unread ? `<div class="bubble-unread">${m.unread}</div>` : '';
  if(m.who==='me'){
    return `
      <div class="bubble-row me">
        <div class="bubble">${m.text}</div>
        <div class="bubble-meta">${metaTop}<div>${m.time}</div></div>
      </div>`;
  } else {
    return `
      <div class="bubble-row you">
        <div class="you-avatar photo-avatar" style="background-image:url('${wallpaperDataUrl}')"></div>
        <div class="bubble">${m.text}</div>
        <div class="bubble-meta">${metaTop}<div>${m.time}</div></div>
      </div>`;
  }
}

  const wrap = document.getElementById('chatScroll');

  dgMessages.forEach(m=>{ wrap.insertAdjacentHTML('beforeend', bubbleHTML(m)); });
  wrap.scrollTop = wrap.scrollHeight;
}
