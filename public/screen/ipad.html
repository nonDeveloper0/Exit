<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>출입관리 아이패드</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Malgun Gothic", "Segoe UI", sans-serif;
    background: #000; color: #f5f5f7; overflow: hidden;
  }

  /* iOS 상태바 */
  .statusbar { position: absolute; top: 14px; left: 0; right: 0; height: 22px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 12px; font-weight: 600; color: #f5f5f7; z-index: 10; }

  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  /* 잠금화면 */
  #passcode { background: radial-gradient(ellipse at 50% 25%, #1e3a5f 0%, #0a0e1a 70%); justify-content: flex-start; padding-top: 60px; }
  .brand { margin-top: 30px; text-align: center; }
  .brand .title { font-size: 18px; font-weight: 600; letter-spacing: .02em; }
  .brand .sub { font-size: 12px; color: #8b95a7; margin-top: 4px; letter-spacing: .08em; }

  .prompt { margin-top: 40px; font-size: 15px; color: #e5e7eb; }

  /* 도트 표시 */
  .dots { display: flex; gap: 14px; margin-top: 24px; height: 16px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #cbd5e1; }
  .dot.fill { background: #f5f5f7; border-color: #f5f5f7; }
  .dots.shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-10px)} 40%,80%{transform:translateX(10px)} }
  .msg { font-size: 12px; color: #f87171; height: 16px; margin-top: 14px; }

  /* 키패드 */
  .keypad { margin-top: auto; margin-bottom: 48px; display: grid; grid-template-columns: repeat(3, 76px); gap: 20px; justify-content: center; }
  .key { width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,.12); border: none; color: #f5f5f7; font-size: 30px; font-weight: 400; display: flex; align-items: center; justify-content: center; }
  .key:active { background: rgba(255,255,255,.28); }
  .key.zero { grid-column: 2; }
  .key.action { background: transparent; font-size: 16px; }
  .key.action:active { background: rgba(255,255,255,.12); }

  /* 출입기록증 화면 */
  #record { background: #000; justify-content: center; align-items: center; padding: 0; }
  #record img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .back-btn { position: absolute; top: 44px; left: 16px; z-index: 20; background: rgba(255,255,255,.14); border: none; color: #f5f5f7; font-size: 15px; padding: 8px 16px; border-radius: 20px; }
  .back-btn:active { background: rgba(255,255,255,.3); }

  .fade-in { animation: fadeIn .5s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>

<div class="statusbar"><span id="clock">22:51</span><span>🔋 88%</span></div>

<!-- 잠금 (비밀번호) -->
<div class="screen active" id="passcode">
  <div class="brand">
    <div class="title">녹산건설 출입관리</div>
    <div class="sub">ACCESS CONTROL TERMINAL</div>
  </div>
  <div class="prompt">비밀번호를 입력하세요</div>
  <div class="dots" id="pcDots"></div>
  <div class="msg" id="pcMsg"></div>
  <div class="keypad" id="pcPad"></div>
</div>

<!-- 출입기록증 -->
<div class="screen" id="record">
  <button class="back-btn" id="recordBack">‹ 뒤로</button>
  <img src="/access-record.png" alt="출입기록증" />
</div>

<script>
  // 뒤로가기(모바일 브라우저 스와이프/버튼)로 화면을 벗어나지 못하게 막음
  history.pushState(null, "", location.href);
  window.addEventListener("popstate", () => history.pushState(null, "", location.href));

  const PASSCODE = "20210812";
  let pcBuf = "";

  // 시계
  function tick() { const d = new Date(); document.getElementById("clock").textContent = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  tick(); setInterval(tick, 10000);

  // 키패드 생성
  function buildPad(padId, onDigit, onDel) {
    const pad = document.getElementById(padId);
    for (let n = 1; n <= 9; n++) addKey(pad, n, () => onDigit(String(n)));
    const spacer = document.createElement("span"); spacer.className = "key action"; pad.appendChild(spacer);
    addKey(pad, 0, () => onDigit("0"), "zero");
    const del = document.createElement("button"); del.className = "key action"; del.textContent = "⌫"; del.onclick = onDel; pad.appendChild(del);
  }
  function addKey(pad, label, fn, extra) { const b = document.createElement("button"); b.className = "key" + (extra ? " " + extra : ""); b.textContent = label; b.onclick = fn; pad.appendChild(b); }

  function renderDots(elId, len) {
    const el = document.getElementById(elId); el.innerHTML = "";
    const n = PASSCODE.length;
    for (let i = 0; i < n; i++) { const d = document.createElement("span"); d.className = "dot" + (i < len ? " fill" : ""); el.appendChild(d); }
  }

  buildPad("pcPad",
    d => {
      if (pcBuf.length >= PASSCODE.length) return;
      pcBuf += d; renderDots("pcDots", pcBuf.length);
      if (pcBuf.length === PASSCODE.length) setTimeout(check, 150);
    },
    () => { pcBuf = pcBuf.slice(0, -1); renderDots("pcDots", pcBuf.length); });
  renderDots("pcDots", 0);

  // 출입기록증에서 비밀번호 화면으로 복귀
  document.getElementById("recordBack").onclick = () => {
    document.getElementById("record").classList.remove("active", "fade-in");
    pcBuf = ""; renderDots("pcDots", 0);
    document.getElementById("pcMsg").textContent = "";
    document.getElementById("passcode").classList.add("active");
  };

  function check() {
    if (pcBuf === PASSCODE) {
      document.getElementById("passcode").classList.remove("active");
      document.getElementById("record").classList.add("active", "fade-in");
    } else {
      const dots = document.getElementById("pcDots");
      if (navigator.vibrate) navigator.vibrate(200);
      dots.classList.add("shake");
      setTimeout(() => dots.classList.remove("shake"), 400);
      document.getElementById("pcMsg").textContent = "비밀번호가 일치하지 않습니다";
      setTimeout(() => document.getElementById("pcMsg").textContent = "", 2000);
      pcBuf = ""; renderDots("pcDots", 0);
    }
  }
</script>
</body>
</html>
